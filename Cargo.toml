# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "crates/plymouth-3dboot",
    "crates/plymouth-3dboot-capi",
    "crates/plymouth-3dboot-sdl",
    "crates/plymouth-3dboot-testutil",
    "apps/viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
plymouth-3dboot = { path = "crates/plymouth-3dboot" }
plymouth-3dboot-sdl = { path = "crates/plymouth-3dboot-sdl" }
plymouth-3dboot-testutil = { path = "crates/plymouth-3dboot-testutil" }
# scalar-math + libm: identical results on native and wasm (no SIMD paths,
# no platform libm), see docs/conventions.md.
glam = { version = "0.33.12", default-features = false, features = ["std", "scalar-math", "libm"] }
gif = { version = "0.14.2", default-features = false, features = ["std", "color_quant"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
libm = "0.2.16"
png = "0.18.1"
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
thiserror = "2.0.21"
rayon = "1.11.0"
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"
