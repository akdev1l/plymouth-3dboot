#
# Rendering must be bit-identical on native and wasm targets. The platform
# math libraries (glibc natively, Emscripten's libc on wasm) may round
# transcendental functions differently, so core code uses the `libm` crate.
# Basic arithmetic and `sqrt` are exactly rounded by IEEE 754 and allowed.
disallowed-methods = [
    { path = "f32::sin", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::cos", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::tan", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::asin", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::acos", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::atan", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::atan2", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::sin_cos", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::sinh", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::cosh", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::tanh", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::exp", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::exp2", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::exp_m1", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::ln", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::ln_1p", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::log", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::log2", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::log10", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::powf", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::powi", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::cbrt", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f32::hypot", reason = "use libm for cross-target determinism (see clippy.toml)" },
