    { path = "f64::acos", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f64::atan", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f64::atan2", reason = "use libm for cross-target determinism (see clippy.toml)" },
    { path = "f64::sin_cos", reason = "use libm for cross-target determinism (see clippy.toml)" },
