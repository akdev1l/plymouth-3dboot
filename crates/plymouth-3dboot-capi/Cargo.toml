# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "plymouth-3dboot-capi"
description = "C API for plymouth-3dboot (libplymouth_3dboot)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Multi-threaded rendering is opt-in per renderer (threads option).
plymouth-3dboot = { workspace = true, features = ["parallel"] }
bytemuck.workspace = true

[features]
# Enabled by cargo-c when building the C library (convention).
capi = []

# cargo-c (`cargo cbuild` / `cargo cinstall`) builds the C library.
[package.metadata.capi.library]
name = "plymouth_3dboot"
# Major ABI version (soname libplymouth_3dboot.so.0); bump on breaking changes.
version_suffix_components = 1

[package.metadata.capi.header]
name = "plymouth-3dboot"
subdirectory = false

[package.metadata.capi.pkg_config]
name = "plymouth-3dboot"
filename = "plymouth-3dboot"
description = "CPU rasterizer for animated 3D models (plymouth-3dboot)"

[lints]
workspace = true
