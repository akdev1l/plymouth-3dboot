# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "plymouth-3dboot"
description = "CPU rasterization of animated 3D models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
gif = { workspace = true, optional = true }
glam.workspace = true
libm.workspace = true
png.workspace = true
rayon = { workspace = true, optional = true }
roxmltree.workspace = true
thiserror.workspace = true

[features]
default = ["gif"]
# Animated GIF output (io::gif).
gif = ["dep:gif"]
# Render bands on multiple threads (rayon); see Renderer::with_threads.
parallel = ["dep:rayon"]

[dev-dependencies]
plymouth-3dboot-testutil.workspace = true
proptest.workspace = true

# Benchmarks run natively only.
[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
